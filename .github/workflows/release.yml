name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish macOS Release
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Resolve release tag & version
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${INPUT_TAG}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Run unit tests
        run: swift test

      - name: Build universal app bundle & release packages
        run: |
          ./scripts/build-app.sh --universal --version "${{ steps.meta.outputs.version }}" --package
          lipo -info "dist/ELM API Tracker.app/Contents/MacOS/ELMUsageTracker"
          ls -lh dist/
          cat dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          DMG="dist/ELM-API-Tracker-v${VERSION}-universal.dmg"
          ZIP="dist/ELM-API-Tracker-v${VERSION}-universal.zip"
          SUMS="dist/SHA256SUMS.txt"

          NOTES_FILE="$(mktemp)"
          cat > "${NOTES_FILE}" <<'EOF'
          ## ELM API Tracker

          Minimal native macOS menu bar utility for tracking your ELM API spend (`https://elm.edina.ac.uk/api/v1/costs`).

          ### Downloads
          - **`.dmg`** — Open and drag **ELM API Tracker** into **Applications**.
          - **`.zip`** — Unzip and move **ELM API Tracker.app** into **Applications**.
          - Built as a **Universal Binary** (Apple Silicon + Intel) for **macOS 14+** (with native Liquid Glass UI on macOS 26+).

          ### First Launch Note (Ad-hoc Signed)
          This build is ad-hoc signed rather than notarized with a paid Apple Developer certificate. If macOS Gatekeeper blocks the first launch:
          1. Open **System Settings → Privacy & Security** and click **Open Anyway**, **or**
          2. Run in Terminal:
             ```bash
             xattr -cr "/Applications/ELM API Tracker.app"
             ```
          EOF

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${DMG}" "${ZIP}" "${SUMS}" --clobber
          else
            gh release create "${TAG}" "${DMG}" "${ZIP}" "${SUMS}" \
              --target "${GITHUB_SHA}" \
              --title "ELM API Tracker ${TAG}" \
              --notes-file "${NOTES_FILE}" \
              --generate-notes
          fi
